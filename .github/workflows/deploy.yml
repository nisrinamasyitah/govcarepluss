name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: GovCare+/package-lock.json

      - name: Install dependencies
        working-directory: GovCare+
        run: npm ci

      - name: Build
        working-directory: GovCare+
        run: npm run build

      - name: Deploy to Firebase Hosting
        working-directory: GovCare+
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          npx firebase-tools@latest deploy --only hosting --project govcarepluss
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
